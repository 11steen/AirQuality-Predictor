<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Air Quality Predictor</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      position: relative;
      overflow: hidden;
      background-color: #222; /* fallback in case images fail */
    }

    .background-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }

    .bg-img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 1s ease-in-out;
      opacity: 0; /* Start with all images hidden */
    }

    .bg-img.active {
      opacity: 1; /* Make active image visible */
    }

    .dark-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      pointer-events: none;
      z-index: 1;
      display: none;
    }

    body.dark-mode .dark-overlay {
      display: block;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border-radius: 1rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      padding: 2rem;
      width: 90%;
      max-width: 500px;
      color: #fff;
      text-align: center;
      z-index: 10;
      position: relative;
    }

    input {
      background: rgba(0, 0, 0, 0.3);
      border: none;
      padding: 10px;
      border-radius: 5px;
      width: 100%;
      color: white;
    }

    input:focus {
      outline: none;
      box-shadow: 0 0 5px #4a77d4;
    }

    .btn-custom {
      background-color: #4a77d4;
      border: none;
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      color: #fff;
      border-radius: 8px;
      margin-top: 10px;
    }

    .btn-custom:hover {
      background-color: #3762bc;
    }

    .footer {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      font-size: 0.9rem;
      color: #ccc;
      z-index: 10;
    }

    .btn-toggle {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: #4a77d4;
      border: none;
      color: white;
      padding: 10px;
      border-radius: 50%;
      cursor: pointer;
    }

    .alert {
      margin-top: 20px;
    }
  </style>
</head>
<body>


  <button class="btn-toggle" onclick="toggleDarkMode()">🌙</button>
  
  <!-- Slideshow -->
  <div class="background-container">
    <img class="bg-img mySlides active" src="https://plus.unsplash.com/premium_photo-1698098205537-f420eaad6f72?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OXx8bmF0dXJlJTIwc2NlbmVyeXxlbnwwfHwwfHx8MA%3D%3D" />
    <img class="bg-img mySlides" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1600&q=80" />
    <img class="bg-img mySlides" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80" />
    <div class="dark-overlay"></div>
  </div>
  
  <div class="glass-card">
    <h2><i class="bi bi-cloud-sun-fill"></i> Air Quality Predictor</h2>
    <form method="POST" action="/predict">
      <div class="mb-3 text-start">
        <label for="weight" class="form-label">Weight</label>
        <input type="text" name="weight" placeholder="e.g., 30.0" required />
      </div>
      <div class="mb-3 text-start">
        <label for="humidity" class="form-label">Humidity</label>
        <input type="text" name="humidity" placeholder="e.g., 45.0" required />
      </div>
      <div class="mb-3 text-start">
        <label for="temperature" class="form-label">Temperature</label>
        <input type="text" name="temperature" placeholder="e.g., 22.0" required />
      </div>
      <button type="submit" class="btn btn-custom">Predict</button>
    </form>

    {% if prediction_text %}
    <div class="alert 
        {% if 'Good' in prediction_text %}
            alert-success
        {% elif 'Bad' in prediction_text %}
            alert-danger
        {% else %}
            alert-warning
        {% endif %}">
      <i class="bi bi-graph-up-arrow"></i> {{ prediction_text }}
    </div>
    {% endif %}
  </div>

  <div class="footer">
    © 2025 Air Quality Predictor. All rights reserved.
  </div>

  <!-- JS Slideshow + Dark Mode -->
  <script>
    const images = document.querySelectorAll('.bg-img');
    let currentIndex = 0;

    function showNextImage() {
      images[currentIndex].classList.remove('active');
      currentIndex = (currentIndex + 1) % images.length;
      images[currentIndex].classList.add('active');
    }

    setInterval(showNextImage, 3000);

    // Dark mode toggle function
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }
  </script>

</body>
</html>
